<!DOCTYPE html>
<html lang="pl" class="theme--compact">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsychoApp — Dokumentacja Psychologiczna</title>
    <!-- Cache-busting `?v=RRRRMMDDggmm` na wszystkich CSS i JS — bumpuj przy
         każdym deployu, żeby nie był potrzebny hard reload. -->
    <link rel="stylesheet" href="css/tokens.css?v=202610110900">
    <link rel="stylesheet" href="css/style.css?v=202610110900">
    <link rel="stylesheet" href="css/compat.css?v=202610110900">
    <link rel="stylesheet" href="css/app-new.css?v=202610110900">
    <!-- Tryb kompaktowy: aktywny przez klasę `theme--compact` na <html>. -->
    <link rel="stylesheet" href="css/compact-new.css?v=202610110900">
    <!-- Formularz wizyty: pasek pól + dziennik akapitów. -->
    <link rel="stylesheet" href="css/form-toolbar.css?v=202610110900">
    <link rel="stylesheet" href="css/visit-form-2026-06.css?v=202610110900">
    <link rel="stylesheet" href="css/calendar.css?v=202610110900">
    <!-- Tablet / wąskie ekrany — musi być ostatni. -->
    <link rel="stylesheet" href="css/responsive.css?v=202610110900">
</head>
<body class="psy-app-body">

<div class="psy-new-shell" id="psy-new-shell">

    <!-- ===== TOPBAR ===== -->
    <header class="psy-new-topbar">
        <div class="psy-new-topbar__left">
            <button
                type="button"
                class="psy-new-topbar__menu-toggle"
                id="psy-new-menu-toggle"
                aria-label="Przełącz menu"
            >☰</button>
            <div class="psy-new-brand psy-new-brand--placeholder" aria-label="Logo lub nazwa aplikacji">Logo lub nazwa aplikacji</div>
        </div>

        <div class="psy-new-topbar__center" id="psy-new-topbar-patient">
            <!-- pasek pacjenta po wyborze -->
        </div>

        <div class="psy-new-topbar__right">
            <button
                type="button"
                class="btn btn--secondary btn--sm psy-new-topbar__btn"
                id="btn-home"
                title="Kalendarz — strona główna"
            >📅<span class="psy-new-topbar__btn-text"> Kalendarz</span></button>

            <button
                type="button"
                class="btn btn--secondary btn--sm psy-new-topbar__btn"
                id="btn-storage"
                title="Miejsce przechowywania danych"
            >Dane: niepodłączone</button>

            <div class="psy-new-topbar__save" id="save-indicator">💾 Autozapis</div>

            <button
                type="button"
                class="btn btn--secondary btn--sm psy-new-topbar__btn psy-new-topbar__btn--icon"
                id="btn-settings"
                title="Ustawienia"
            >⚙️</button>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="psy-new-sidebar" id="psy-new-sidebar">
        <!-- wypełniane przez AppController._renderSidebar() -->
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="psy-new-main" id="psy-new-main">
        <!-- wypełniane przez AppController._renderView() -->
    </main>

</div>

<!-- Globalny kontener toastów. Prawy dolny róg: nie zasłania górnego paska
     (stan zapisu, „Połącz ponownie") ani przycisków w nagłówku widoku. -->
<psy-toast-container id="psy-app-toasts" position="bottom-right"></psy-toast-container>

<noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;">
        <h1>PsychoApp</h1>
        <p>Ta aplikacja wymaga włączonego JavaScript.</p>
    </div>
</noscript>

<!-- xlsx-js-style (fork SheetJS ze stylami) — globalny `XLSX` dla trybu
     folderu lokalnego i przycisku „Pobierz kopię". -->
<script src="lib/xlsx-js-style.min.js"></script>

<script type="module" src="js/app-new.js?v=202610110900"></script>

</body>
</html>

<body class="psy-app-body">

<div class="psy-new-shell" id="psy-new-shell">

    <!-- ===== TOPBAR ===== -->
    <header class="psy-new-topbar">
        <div class="psy-new-topbar__left">
            <button
                type="button"
                class="psy-new-topbar__menu-toggle"
                id="psy-new-menu-toggle"
                aria-label="Przełącz menu"
            >☰</button>
            <div class="psy-new-brand psy-new-brand--placeholder" aria-label="Logo lub nazwa aplikacji">Logo lub nazwa aplikacji</div>
        </div>

        <div class="psy-new-topbar__center" id="psy-new-topbar-patient">
            <!-- pasek pacjenta po wyborze -->
        </div>

        <div class="psy-new-topbar__right">
            <button
                type="button"
                class="btn btn--secondary btn--sm psy-new-topbar__btn"
                id="btn-home"
                title="Kalendarz — strona główna"
            >📅<span class="psy-new-topbar__btn-text"> Kalendarz</span></button>

            <button
                type="button"
                class="btn btn--secondary btn--sm psy-new-topbar__btn"
                id="btn-storage"
                title="Miejsce przechowywania danych"
            >Dane: niepodłączone</button>

            <div class="psy-new-topbar__save" id="save-indicator">💾 Autozapis</div>

            <button
                type="button"
                class="btn btn--secondary btn--sm psy-new-topbar__btn psy-new-topbar__btn--icon"
                id="btn-settings"
                title="Ustawienia"
            >⚙️</button>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="psy-new-sidebar" id="psy-new-sidebar">
        <!-- wypełniane przez AppController._renderSidebar() -->
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="psy-new-main" id="psy-new-main">
        <!-- wypełniane przez AppController._renderView() -->
    </main>

</div>

<!-- Globalny kontener toastów. Prawy dolny róg: nie zasłania górnego paska
     (stan zapisu, „Połącz ponownie") ani przycisków w nagłówku widoku. -->
<psy-toast-container id="psy-app-toasts" position="bottom-right"></psy-toast-container>

<noscript>

    </div>
</noscript>

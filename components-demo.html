<!DOCTYPE html>
<html lang="pl" class="theme--compact">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsychoApp – Demo komponentów</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/compat.css">
    <style>
        /* Demo-only controls (nie wchodzą do produkcji) */
        .demo-toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 8px 12px;
            background: #0F172A;
            color: #F8FAFC;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            font-size: 12.5px;
        }
        .demo-toolbar__brand {
            font-weight: 700;
            color: #38BDF8;
        }
        .demo-toolbar__sep {
            width: 1px;
            height: 20px;
            background: #334155;
        }
        .demo-toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .demo-toolbar__metric {
            margin-left: auto;
            padding: 4px 10px;
            background: #1E293B;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
        }
        .demo-toolbar__metric strong {
            color: #FACC15;
            font-weight: 700;
        }
        .demo-viewport-frame {
            position: relative;
            margin: 12px auto;
            padding: 10px;
            max-width: 1366px;
            background: #fff;
            border: 2px dashed #94A3B8;
            border-radius: 8px;
        }
        .demo-viewport-frame::before {
            content: "viewport 1366×768 (symulowany)";
            position: absolute;
            top: -10px;
            left: 12px;
            padding: 0 6px;
            background: #fff;
            color: #475569;
            font-size: 11px;
            font-weight: 600;
        }
        .demo-viewport-frame--active {
            height: 768px;
            overflow: auto;
            resize: both;
        }
        .demo-section-title {
            margin: 16px 0 6px;
            padding: 4px 8px;
            background: #F1F5F9;
            border-left: 4px solid #2563EB;
            font-size: 13px;
            font-weight: 700;
            color: #0F172A;
        }
    </style>
</head>
<body>

<div class="demo-toolbar" role="toolbar" aria-label="Demo komponentów – kontrolki">
    <span class="demo-toolbar__brand">PsychoApp · Demo komponentów</span>
    <span class="demo-toolbar__sep"></span>
    <label>
        <input type="checkbox" id="demo-toggle-compact" checked>
        <span>Tryb kompaktowy</span>
    </label>
    <label>
        <input type="checkbox" id="demo-toggle-frame">
        <span>Ramka 1366×768</span>
    </label>
    <label>
        <input type="checkbox" id="demo-toggle-autocollapse">
        <span>Auto-collapse (klik poza)</span>
    </label>
    <div class="demo-toolbar__metric" aria-live="polite">
        Widoczne pola „above the fold”: <strong id="demo-metric-count">0</strong>
    </div>
</div>

<main id="main-content" style="margin-left:0; margin-top:0; max-width:1200px; padding: 12px;">
    <div id="demo-viewport" class="demo-viewport-frame" style="border: none; padding: 0;">
        <psy-components-demo id="psy-components-demo"></psy-components-demo>
    </div>
</main>

<script type="module">
    import './js/components/demo.js';

    const demo = document.getElementById('psy-components-demo');
    if (demo) {
        demo.hidden = false;
    }
</script>

<script>
    // ========================================================================
    //  Demo runtime: przełączniki motywu + licznik widocznych pól
    //  (skrypt nie jest używany w produkcji, tylko w components-demo.html)
    // ========================================================================
    (function () {
        const root = document.documentElement;
        const cbCompact = document.getElementById('demo-toggle-compact');
        const cbFrame = document.getElementById('demo-toggle-frame');
        const cbAuto = document.getElementById('demo-toggle-autocollapse');
        const frame = document.getElementById('demo-viewport');
        const metric = document.getElementById('demo-metric-count');

        // Deklarujemy state i harmonogramowanie na samej górze IIFE, żeby uniknąć TDZ
        // przy wczesnych wywołaniach `schedule()` z applyCompact/applyFrame.
        let scheduled = false;
        function schedule() {
            if (scheduled) return;
            scheduled = true;
            requestAnimationFrame(() => {
                scheduled = false;
                countVisibleFields();
            });
        }

        // --- Tryb kompaktowy ---
        function applyCompact(enabled) {
            root.classList.toggle('theme--compact', !!enabled);
            schedule();
        }
        cbCompact.addEventListener('change', () => applyCompact(cbCompact.checked));
        applyCompact(cbCompact.checked);


        // --- Ramka 1366x768 ---
        function applyFrame(enabled) {
            frame.classList.toggle('demo-viewport-frame--active', !!enabled);
            frame.style.border = enabled ? '2px dashed #94A3B8' : 'none';
            frame.style.padding = enabled ? '10px' : '0';
            schedule();
        }
        cbFrame.addEventListener('change', () => applyFrame(cbFrame.checked));

        // --- Auto-collapse (propagacja do wszystkich psy-collapsible w demo) ---
        function applyAutoCollapse(enabled) {
            document.querySelectorAll('psy-collapsible').forEach((el) => {
                if (enabled) {
                    el.setAttribute('auto-collapse', '');
                } else {
                    el.removeAttribute('auto-collapse');
                }
            });
        }
        cbAuto.addEventListener('change', () => applyAutoCollapse(cbAuto.checked));

        // --- Licznik widocznych pól w viewporcie ---
        const FIELD_SELECTOR = [
            'input:not([type="hidden"])',
            'select',
            'textarea',
            '.psy-checkbox-group__item',
            '.psy-radio-group__item'
        ].join(', ');

        function isVisibleInViewport(el, viewportRect) {
            const rect = el.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return false;

            return (
                rect.bottom > viewportRect.top &&
                rect.top < viewportRect.bottom &&
                rect.right > viewportRect.left &&
                rect.left < viewportRect.right
            );
        }

        function countVisibleFields() {
            const frameActive = frame.classList.contains('demo-viewport-frame--active');
            const viewportRect = frameActive
                ? frame.getBoundingClientRect()
                : { top: 0, left: 0, right: window.innerWidth, bottom: window.innerHeight };

            let count = 0;
            document.querySelectorAll(FIELD_SELECTOR).forEach((el) => {
                if (isVisibleInViewport(el, viewportRect)) {
                    count++;
                }
            });

            metric.textContent = String(count);
        }

        window.addEventListener('scroll', schedule, true);

        window.addEventListener('resize', schedule);
        frame.addEventListener('scroll', schedule);

        // Po zainicjalizowaniu komponentów Lit – pierwszy pomiar
        setTimeout(schedule, 200);
        setTimeout(schedule, 600);
        setTimeout(schedule, 1200);
    })();
</script>

</body>
</html>
